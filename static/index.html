<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codex Session Viewer</title>
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-title-line">
            <h1>Codex Session Viewer</h1>
            <span id="appVersion" class="app-version" aria-label="Application version"></span>
          </div>
          <div id="rootPath" class="muted path-text"></div>
        </div>
        <nav id="viewTabs" class="view-tabs" aria-label="Viewer mode">
          <button class="view-tab" type="button" data-view="events">Events</button>
          <button class="view-tab active" type="button" data-view="turns">Turns</button>
        </nav>
        <div class="topbar-actions">
          <label class="field-label" for="dateInput">Date</label>
          <input id="dateInput" type="date">
          <button id="refreshButton" type="button">Refresh</button>
        </div>
      </header>

      <main id="mainLayout" class="layout">
        <aside class="sidebar">
          <div class="panel-title">Files</div>
          <div id="dateStatus" class="muted"></div>
          <div id="fileList" class="file-list"></div>
        </aside>

        <section class="stream-panel">
          <div class="stream-toolbar">
            <div class="stream-file-block">
              <div class="stream-file-line">
                <div id="activeFile" class="active-file"></div>
                <div class="file-actions">
                  <div id="copyTailGroup" class="split-button">
                    <button id="copyTailButton" class="tail-copy-button" type="button" disabled>Copy tail</button>
                    <button
                      id="copyTailMenuButton"
                      class="tail-copy-toggle"
                      type="button"
                      disabled
                      aria-haspopup="true"
                      aria-expanded="false"
                      aria-label="Tail command variants"
                    >▾</button>
                    <div id="copyTailMenu" class="split-menu" role="menu" hidden></div>
                  </div>
                  <button id="copyHandoffButton" class="session-handoff-button" type="button" disabled>Copy handoff</button>
                </div>
              </div>
              <div id="streamStatus" class="muted"></div>
            </div>
            <div class="toolbar-controls">
              <input id="searchInput" type="search" placeholder="Search turns">
              <div id="eventControls" class="toolbar-mode-controls" hidden>
                <select id="eventOrderSelect" aria-label="Event order">
                  <option value="latest-bottom">Latest bottom</option>
                  <option value="latest-top" selected>Latest top</option>
                </select>
                <label class="check-label"><input id="autoScrollInput" type="checkbox" checked> Auto-scroll</label>
                <button id="pauseButton" type="button">Pause</button>
              </div>
              <div id="turnControls" class="toolbar-mode-controls">
                <div class="segmented-control" aria-label="Turn density">
                  <button class="segment active" type="button" data-turn-density="compact">Compact</button>
                  <button class="segment" type="button" data-turn-density="narrative">Narrative</button>
                </div>
              </div>
            </div>
          </div>
          <div id="turnOverview" class="turn-overview"></div>
          <div id="eventFilterBar" class="event-filter-bar">
            <button class="filter-chip active" type="button" data-filter="all">All</button>
            <button class="filter-chip" type="button" data-filter="messages">Messages</button>
            <button class="filter-chip" type="button" data-filter="tools">Tools</button>
            <button class="filter-chip" type="button" data-filter="patches">Patches</button>
            <button class="filter-chip" type="button" data-filter="errors">Errors</button>
            <button class="filter-chip" type="button" data-filter="tokens">Tokens</button>
            <button class="filter-chip" type="button" data-filter="context">Context</button>
          </div>
          <div id="eventStream" class="event-stream"></div>
        </section>

        <div
          id="inspectorResizeHandle"
          class="resize-handle"
          role="separator"
          aria-label="Resize inspector"
          aria-orientation="vertical"
          tabindex="0"
        ></div>

        <aside id="inspectorPanel" class="inspector-panel">
          <div class="inspector-header">
            <div id="inspectorTitle" class="panel-title">Turn Inspector</div>
            <button id="inspectorWideButton" class="inspector-wide-button" type="button">Wide</button>
          </div>
          <div id="inspectorStatus" class="muted">Select an event</div>
          <div id="inspectorTabs" class="inspector-tabs">
            <button class="inspector-tab active" type="button" data-inspector-tab="summary">Summary</button>
            <button class="inspector-tab" type="button" data-inspector-tab="structured">Structured</button>
            <button class="inspector-tab" type="button" data-inspector-tab="raw">Raw</button>
            <button class="inspector-tab" type="button" data-inspector-tab="related">Related</button>
          </div>
          <div id="inspectorContent" class="inspector-content"></div>
        </aside>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
